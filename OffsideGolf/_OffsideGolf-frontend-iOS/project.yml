name: OffsideGolf
options:
  bundleIdPrefix: ai.offside
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      ENABLE_TESTABILITY: NO
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  OffsideGolfCore:
    path: ../Packages/OffsideGolfCore
targets:
  OffsideGolf:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: OffsideGolfCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.offside.OffsideGolf
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
  OffsideGolfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/OffsideGolfUITests
    dependencies:
      - target: OffsideGolf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  OffsideGolfPlatformTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/OffsideGolfPlatformTests
    dependencies:
      - target: OffsideGolf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  OffsideGolf:
    build:
      targets:
        OffsideGolf: all
    test:
      targets:
        - OffsideGolfUITests
        - OffsideGolfPlatformTests
      gatherCoverageData: true
